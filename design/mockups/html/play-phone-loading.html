<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>funground Play on a phone, while Python loads</title>
<link rel="stylesheet" href="../funground.css">
</head>
<body>
<style>
body { margin: 0; }
a { color: #b22222; } a:hover { color: #7f1d1d; }
.only-dark { display: none; } [data-theme="dark"] .only-dark { display: inline; } [data-theme="dark"] .only-light { display: none; }
.thumb { width: 30px; height: 30px; border-radius: 6px; border: 1.5px solid var(--ink); display: inline-grid; place-items: center; background: #191970; }
.thumb svg { width: 100%; height: 100%; display: block; border-radius: 4px; }
.bar2 { display: flex; align-items: center; gap: 8px; padding: 6px 12px 8px; }
.loading { width: 100%; aspect-ratio: 640 / 400; display: grid; place-content: center; gap: 10px; padding: 24px; box-sizing: border-box; background: #fdf5e6; color: #191970; text-align: center; font: 400 14px/1.45 "Atkinson Hyperlegible Next", system-ui, sans-serif; }
.loading b { font: 700 17px/1.2 "Bricolage Grotesque", system-ui, sans-serif; }
.fab { position: absolute; right: 16px; bottom: 16px; }
.stack { position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; }
</style>
<div class="fg-paper fg-play" data-theme="light">

<header class="fg-header" style="padding: 8px 12px; gap: 10px;">
  <a class="fg-header__brand" href="Main.dc.html" style="font-size: 22px;"><img class="only-light" src="../assets/funground-mark.svg" alt="" style="width: 28px; height: 28px;"><img class="only-dark" src="../assets/funground-mark-on-dark.svg" alt="" style="width: 28px; height: 28px;">funground</a>
  <span class="fg-sticker fg-sticker--turq" style="margin-left: auto;">Play</span>
  <button class="fg-header__menu" aria-label="Menu" style="display: inline-grid; margin-left: 0;"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</header>

<div class="fg-play__bar" style="padding: 8px 12px 0; border-bottom: 0;">
  <button class="fg-picker" aria-haspopup="dialog" style="width: 100%; justify-content: flex-start;"><span class="thumb"><svg viewBox="0 0 64 40" aria-hidden="true"><rect width="64" height="40" fill="#191970"/><circle cx="32" cy="20" r="12" fill="#ff6347"/></svg></span>1. First sketch <small>Basics</small><span style="flex: 1;"></span><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6l4 4 4-4"/></svg></button>
</div>
<div class="bar2" style="border-bottom: 2px solid var(--ink);">
  <button class="fg-btn fg-btn--run fg-btn--small" disabled="disabled"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>Run</button>
  <button class="fg-btn fg-btn--secondary fg-btn--small" disabled="disabled">Stop</button>
  <label class="fg-switch"><i></i>Auto</label>
  <span style="flex: 1;"></span>
  <button class="fg-iconbtn" aria-label="Share"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 2.5h4.5V7M13.5 2.5 7.5 8.5M12 9.5v4H2.5V4H6"/></svg></button>
  <button class="fg-iconbtn" aria-label="How Play works"><svg viewBox="0 0 18 18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="9" cy="9" r="7"/><path d="M7 7.2a2 2 0 1 1 3 1.7c-.8.5-1 .9-1 1.8M9 13.4v.1"/></svg></button>
</div>

<div class="stack">
  <section class="fg-play__stage" aria-label="The picture" style="position: sticky; top: 0; background: var(--paper);">
    <div class="fg-play__picture" style="padding: 12px;">
      <div class="fg-play__frame" style="width: 100%;">
        <div class="loading"><b>Loading Python and funground</b><span>About 12 MB, the first time only. Read the sketch while you wait.</span><div class="fg-progress"><i></i></div></div>
      </div>
    </div>
    <div class="fg-play__caption" style="padding: 0 12px 8px;"><span class="fg-status fg-status--loading" style="padding: 0;">Loading, 62%</span><span>640 × 400 at 57%</span></div>
    <div class="fg-console"><div class="fg-console__head">Output<span class="spacer" style="flex: 1;"></span><span style="font-weight: 400;">▾</span></div></div>
  </section>

  <section class="fg-play__editor" aria-label="Code" style="flex: 1;">
    <div class="fg-play__tab"><b>sketch.py</b><span>7 lines</span></div>
    <pre class="fg-code" style="font-size: 14px; min-height: 280px;"><span class="ln"><span class="k">import</span> funground <span class="k">as</span> f</span><span class="ln"></span><span class="ln">f.size(<span class="n">640</span>, <span class="n">400</span>)</span><span class="ln">f.background(<span class="s">"midnightblue"</span>)</span><span class="ln is-current">f.fill(<span class="s">"tomato"</span>)</span><span class="ln">f.circle(<span class="n">320</span>, <span class="n">200</span>, <span class="n">120</span>)</span><span class="ln">f.show()</span></pre>
  </section>
  <button class="fg-btn fg-btn--run fab" aria-label="Run the sketch"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>Run</button>
</div>
</div>
</body>
</html>
