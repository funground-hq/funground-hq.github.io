# Builds the funground website and deploys it to GitHub Pages.
# The site is assembled from this repository and from funground-hq/funground (branch main),
# so it is also rebuilt every day: a change to funground's docs appears without a change here.
# The Play page's browser runner comes from funground-hq/funground-web; it runs a funground wheel built
# from RUNTIME_BRANCH of funground (the 0.2 work, until 0.2 is released and main has the web runner).
name: Deploy site

on:
  push:
    branches: [main]
  pull_request:              # build and check only; nothing is deployed from a pull request
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"      # every day at 03:17 UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NO_MKDOCS_2_WARNING: "true"   # Material prints a notice about MkDocs 2.0; --strict must not trip on it
  RUNNER_BRANCH: main           # funground-web: the browser runner (runner/) and tools/build_runtime.py
  RUNTIME_BRANCH: release-0.2-web   # funground: the branch the runner runs in the browser

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v7

      - name: Check out funground (the guide, reference and gallery)
        uses: actions/checkout@v7
        with:
          repository: funground-hq/funground
          ref: main
          path: funground

      - name: Check out funground-web (the browser runner)
        uses: actions/checkout@v7
        with:
          repository: funground-hq/funground-web
          ref: ${{ env.RUNNER_BRANCH }}
          path: funground-web

      - name: Check out funground for the runner (the branch it runs)
        uses: actions/checkout@v7
        with:
          repository: funground-hq/funground
          ref: ${{ env.RUNTIME_BRANCH }}
          path: funground-runtime

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install MkDocs and Material
        run: pip install -r requirements.txt

      - name: Build the runner's runtime (the wasm wheels from their release, the funground wheel, the examples)
        run: python funground-web/tools/build_runtime.py --funground funground-runtime

      - name: Assemble the docs
        run: python tools/assemble.py funground docs --runner funground-web/runner

      - name: Check the links
        run: python tools/check_links.py docs mkdocs.yml funground

      - name: Build the site
        run: mkdocs build --strict

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
